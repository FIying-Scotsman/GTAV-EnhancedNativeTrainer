name: Release Build

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_FILE_PATH: ./EnhancedNativeTrainer.sln
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[18.0,19.0)"

      - name: Build
        run: >
          msbuild ${{ env.SOLUTION_FILE_PATH }}
          /restore
          /m
          /p:Configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path EnhancedNativeTrainer/bin/Release/* `
            -DestinationPath EnhancedNativeTrainer-release.zip

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnhancedNativeTrainer-release
          path: EnhancedNativeTrainer-release.zip
          retention-days: 90
          if-no-files-found: error
