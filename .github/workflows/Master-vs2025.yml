name: Release Build

on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  SOLUTION_FILE_PATH: ./EnhancedNativeTrainer.sln
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[18.0,)"

      - name: Get Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'VERSION_STRING\s*=\s*"\K[^"]+' version.sh || echo "${GITHUB_REF_NAME}")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        run: >
          msbuild ${{ env.SOLUTION_FILE_PATH }}
          /restore
          /m
          /p:Configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Package
        shell: pwsh
        run: |
          $staging = "release-staging"
          New-Item -ItemType Directory -Path "$staging/Enhanced Native Trainer" -Force | Out-Null
          Copy-Item "EnhancedNativeTrainer/bin/Release/EnhancedNativeTrainer.asi" -Destination $staging
          Copy-Item "EnhancedNativeTrainer/Documents/ent-config.xml" -Destination "$staging/Enhanced Native Trainer"
          Copy-Item "EnhancedNativeTrainer/Documents/ENT_vehicle_previews.ytd" -Destination "$staging/Enhanced Native Trainer"
          Compress-Archive `
            -Path "$staging/*" `
            -DestinationPath EnhancedNativeTrainer-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: EnhancedNativeTrainer-${{ steps.version.outputs.version }}.zip
