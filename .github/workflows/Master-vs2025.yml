name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SOLUTION_FILE_PATH: ./EnhancedNativeTrainer.sln
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[18.0,19.0)"

      - name: Get Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'VERSION_STRING\s*=\s*"\K[^"]+' version.sh || echo "${GITHUB_REF_NAME}")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        run: >
          msbuild ${{ env.SOLUTION_FILE_PATH }}
          /restore
          /m
          /p:Configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path EnhancedNativeTrainer/bin/Release/* `
            -DestinationPath EnhancedNativeTrainer-${{ steps.version.outputs.version }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: EnhancedNativeTrainer-${{ steps.version.outputs.version }}.zip
